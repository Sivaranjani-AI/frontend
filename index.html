<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Practice Tasks</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Task 2: Box Model Visualizer -->
  <section>
    <h2>Box Model Visualizer</h2>
    <div class="card content-box">Content-box</div>
    <div class="card border-box">Border-box</div>
    <div class="card padding-box">Padding-box</div>
  </section>

  <!-- Task 3: Positioning -->
  <section>
    <header class="fixed-header">Fixed Header</header>
    <div class="relative-container">
      <p>This is a relative container.</p>
      <span class="absolute-badge">New!</span>
    </div>
  </section>

  <!-- Task 4: Responsive Layout Debugging -->
  <section>
    <h2>Responsive Card</h2>
    <div class="responsive-card">
      <h3>Title</h3>
      <p>This card fits perfectly on mobile screens without overflow.</p>
    </div>
  </section>

  <!-- Task 5: Scalable Stylesheet Dashboard -->
  <section>
    <h2>Dashboard Grid</h2>
    <div class="dashboard">
      <div class="column">Column 1</div>
      <div class="column">Column 2</div>
      <div class="column">Column 3</div>
    </div>
  </section>

</body>
</html>
